<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery Test Report Generator</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f1f4f8; color: #213d60; margin: 0; }
  main { max-width: 640px; margin: 40px auto; background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 1px 4px #0002; }
  h1 { margin-top: 0; font-size: 1.5rem; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #b8c2d0; border-radius: 4px; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  button { margin-top: 20px; padding: 10px 18px; background: #213d60; color: #fff; border: 0; border-radius: 4px; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  small { color: #5b6b80; }
  #status { margin-top: 16px; }
  #error { color: #b00020; margin-top: 16px; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: .9rem; }
  td, th { padding: 6px 8px; text-align: left; } tr:nth-child(even) { background: #f1f4f8; }
  th { background: #213d60; color: #fff; }
  .PASS { color: #1b7f3b; font-weight: 700; } .FAIL { color: #b00020; font-weight: 700; }
  #download { display: inline-block; margin-top: 16px; color: #18799c; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Battery Test Report Generator</h1>
  <form id="form">
    <label for="file">Measurement CSV (max 10 MB)</label>
    <input id="file" type="file" accept=".csv,text/csv" required>
    <small>Columns: timestamp, voltage_v, current_a, soc_pct</small>
    <div class="row">
      <div><label for="max_voltage">Max voltage (V)</label>
        <input id="max_voltage" type="number" step="any" min="0" placeholder="optional"></div>
      <div><label for="max_abs_current">Max absolute current (A)</label>
        <input id="max_abs_current" type="number" step="any" min="0" placeholder="optional"></div>
    </div>
    <small>Leave limits blank for no pass/fail assessment.</small><br>
    <button id="submit" type="submit">Generate report</button>
  </form>
  <div id="status" role="status"></div>
  <div id="error" role="alert"></div>
  <div id="result" hidden>
    <table id="metrics"></table>
    <a id="download">Download PDF</a>
  </div>
</main>
<script src="config.js"></script>
<script>
const POLL_INTERVAL_MS = 2000;
const POLL_TIMEOUT_MS = 5 * 60 * 1000;
const form = document.getElementById('form');
const statusBox = document.getElementById('status');
const errorBox = document.getElementById('error');
const result = document.getElementById('result');
const button = document.getElementById('submit');

async function api(path, options) {
  const response = await fetch(window.API_BASE_URL.replace(/\/$/, '') + path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function upload(target, file) {
  const body = new FormData();
  for (const [key, value] of Object.entries(target.fields)) body.append(key, value);
  body.append('file', file); // S3 requires the file to be the last field.
  const response = await fetch(target.url, { method: 'POST', body });
  if (!response.ok) throw new Error('Upload failed (files must be 10 MB or smaller)');
}

async function waitForJob(jobId) {
  const deadline = Date.now() + POLL_TIMEOUT_MS;
  while (Date.now() < deadline) {
    const job = await api(`/jobs/${jobId}`);
    statusBox.textContent = `Status: ${job.status}`;
    if (job.status === 'COMPLETED') return job;
    if (job.status === 'FAILED') throw new Error(job.error);
    await new Promise((resolve) => setTimeout(resolve, POLL_INTERVAL_MS));
  }
  throw new Error('Timed out waiting for the report. Please try again.');
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBox.textContent = '';
  statusBox.textContent = '';
  result.hidden = true;
  button.disabled = true;
  try {
    if (!window.API_BASE_URL) throw new Error('Set API_BASE_URL in frontend/config.js');
    const file = document.getElementById('file').files[0];
    const created = await api('/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filename: file.name,
        max_voltage: document.getElementById('max_voltage').value,
        max_abs_current: document.getElementById('max_abs_current').value,
      }),
    });
    statusBox.textContent = 'Uploading...';
    await upload(created.upload, file);
    await api(`/jobs/${created.job_id}/submit`, { method: 'POST' });
    show(await waitForJob(created.job_id));
  } catch (error) {
    errorBox.textContent = error.message;
    statusBox.textContent = '';
  } finally {
    button.disabled = false;
  }
});

function show(job) {
  statusBox.textContent = 'Report ready';
  const table = document.getElementById('metrics');
  table.replaceChildren();
  const head = table.insertRow();
  for (const text of ['Metric', 'Result']) {
    const cell = document.createElement('th');
    cell.textContent = text;
    head.appendChild(cell);
  }
  for (const [key, value] of Object.entries(job.metrics)) {
    const row = table.insertRow();
    row.insertCell().textContent = key;
    const cell = row.insertCell();
    cell.textContent = value;
    if (key === 'Test assessment') cell.className = value.replace(/ /g, '_');
  }
  document.getElementById('download').href = job.download_url;
  result.hidden = false;
}
</script>
</body>
</html>
